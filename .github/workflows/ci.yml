name: CI

# 触发条件：主干推送、面向主干的 PR，以及手动触发
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支的旧流水线在新提交到来时自动取消，省 runner 额度
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 最小权限：整个工作流只需要读代码（上传 artifact 不需要额外权限）。
permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test:
    name: 编译与测试
    runs-on: ubuntu-latest
    # 不设的话失败的任务会挂满默认 6 小时；本仓库全量构建 + 测试实测约 4 分钟
    timeout-minutes: 15

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      # 解决方案文件是 .slnx，需要 SDK 9.0.200+；
      # 运行目标框架是 net9.0（见 Directory.Build.props），同一个 SDK 即可覆盖。
      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      # NuGet 包缓存：键里带上工程文件与 Directory.Build.props 的哈希，
      # 依赖树没变就直接命中缓存，省掉每次几十秒的下载。
      - name: 缓存 NuGet 包
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'AuthHub.slnx') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: 还原依赖
        run: dotnet restore AuthHub.slnx

      # 本仓库的门槛是"编译 0 警告 0 错误"，本地一直按这个标准跑。
      # CI 上加 -warnaserror 把它变成硬门禁：任何新警告（包括 SDK 升级引入的
      # 新分析器规则）都会让流水线变红，而不是被刷进日志里没人看见。
      - name: 编译（Release，警告即失败）
        run: dotnet build AuthHub.slnx -c Release --no-restore -warnaserror

      - name: 单元测试
        run: >
          dotnet test tests/AuthHub.UnitTests/AuthHub.UnitTests.csproj
          -c Release --no-build
          --logger "trx;LogFileName=unit.trx"
          --results-directory ./TestResults

      # 集成测试用 WebApplicationFactory 起真实管道，数据库是临时 SQLite 文件，
      # 因此不需要在 CI 里准备 SQL Server 之类的服务。
      - name: 集成测试
        run: >
          dotnet test tests/AuthHub.IntegrationTests/AuthHub.IntegrationTests.csproj
          -c Release --no-build
          --logger "trx;LogFileName=integration.trx"
          --results-directory ./TestResults

      - name: 上传测试结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
          retention-days: 7

  dependency-audit:
    name: 依赖漏洞检查
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: 还原依赖
        run: dotnet restore AuthHub.slnx

      # 需要先 restore：该命令读的是 assets 文件里的实际依赖树。
      # --include-transitive 会把间接依赖（漏洞往往藏在这里）一并列出。
      #
      # 这个步骤目前是"信息性"的：`dotnet list package --vulnerable` 即使发现漏洞
      # 也返回退出码 0，不会让流水线变红。要真正卡住合并，
      # 可在后续接 OWASP Dependency Check（需要 NVD API Key，且耗时较长）。
      - name: 列出存在已知漏洞的包
        continue-on-error: true
        run: |
          for project in src/*/*.csproj; do
            echo "::group::${project}"
            dotnet list "${project}" package --vulnerable --include-transitive
            echo "::endgroup::"
          done

      - name: 提示
        run: |
          echo "如需失败即阻断，请接入 OWASP Dependency Check："
          echo "https://github.com/dependency-check/DependencyCheck"

  docker-image:
    name: 镜像构建校验
    runs-on: ubuntu-latest
    # Dockerfile 是部署路径的一部分，但它不在常规"编译 + 测试"的覆盖范围内：
    # 改了代码却忘了同步 Dockerfile（依赖、入口、端口）时，只有发布那天才会炸。
    # 这里只构建、不推送，把"镜像还能不能构建出来"变成每次提交都验证的事。
    timeout-minutes: 20

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置 Buildx
        uses: docker/setup-buildx-action@v3

      # 只构建不推送。层缓存走 GHA 缓存：工程文件没变时 restore 会直接命中，
      # 构建时间从几分钟降到几十秒。
      - name: 构建镜像
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: authhub:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
