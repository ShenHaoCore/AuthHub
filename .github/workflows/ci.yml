name: CI

# 触发条件：主干推送、面向主干的 PR，以及手动触发
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支的旧流水线在新提交到来时自动取消，省 runner 额度
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test:
    name: 编译与测试
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      # 解决方案文件是 .slnx，需要 SDK 9.0.200+；
      # 运行目标框架仍是 net8.0（见 Directory.Build.props），两者不冲突。
      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      # NuGet 包缓存：键里带上工程文件与 Directory.Build.props 的哈希，
      # 依赖树没变就直接命中缓存，省掉每次几十秒的下载。
      - name: 缓存 NuGet 包
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'AuthHub.slnx') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: 还原依赖
        run: dotnet restore AuthHub.slnx

      # 当前编译结果是 0 警告 0 错误。若想在 CI 上强制守住这一点，
      # 给下面这条命令加上 -warnaserror 即可；这里默认不加，
      # 是为了避免 SDK 补丁版本引入新分析器规则时把流水线误伤成红色。
      - name: 编译（Release）
        run: dotnet build AuthHub.slnx -c Release --no-restore

      - name: 单元测试
        run: >
          dotnet test tests/AuthHub.UnitTests/AuthHub.UnitTests.csproj
          -c Release --no-build
          --logger "trx;LogFileName=unit.trx"
          --results-directory ./TestResults

      # 集成测试用 WebApplicationFactory 起真实管道，数据库是临时 SQLite 文件，
      # 因此不需要在 CI 里准备 SQL Server 之类的服务。
      - name: 集成测试
        run: >
          dotnet test tests/AuthHub.IntegrationTests/AuthHub.IntegrationTests.csproj
          -c Release --no-build
          --logger "trx;LogFileName=integration.trx"
          --results-directory ./TestResults

      - name: 上传测试结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
          retention-days: 7

  dependency-audit:
    name: 依赖漏洞检查
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: 还原依赖
        run: dotnet restore AuthHub.slnx

      # 需要先 restore：该命令读的是 assets 文件里的实际依赖树。
      # --include-transitive 会把间接依赖（漏洞往往藏在这里）一并列出。
      #
      # 这个步骤目前是"信息性"的：`dotnet list package --vulnerable` 即使发现漏洞
      # 也返回退出码 0，不会让流水线变红。要真正卡住合并，
      # 可在后续接 OWASP Dependency Check（需要 NVD API Key，且耗时较长）。
      - name: 列出存在已知漏洞的包
        continue-on-error: true
        run: |
          for project in src/*/*.csproj; do
            echo "::group::${project}"
            dotnet list "${project}" package --vulnerable --include-transitive
            echo "::endgroup::"
          done

      - name: 提示
        run: |
          echo "如需失败即阻断，请接入 OWASP Dependency Check："
          echo "https://github.com/dependency-check/DependencyCheck"
